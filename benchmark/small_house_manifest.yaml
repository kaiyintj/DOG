robot_starts:
  - id: kitchen_view
    # x/y/yaw in Gazebo world. Start validation is a run case, not source data.
    pose: [3.5, 1.0, 0.0]
    spawn_height_m: 0.35
  - id: kitchen_close_view
    # Stable view toward the dining set; validate with the matching case first.
    pose: [5.0, 2.4, -1.0]
    spawn_height_m: 0.35
  - id: dining_southeast_view
    # Stable view of the less-occluded southeast side of the dining chairs.
    pose: [8.0, -0.8, 2.35]
    spawn_height_m: 0.35

cases:
  - id: validate_kitchen_close
    start: kitchen_close_view
    expected: start_validation
  - id: validate_dining_southeast
    start: dining_southeast_view
    expected: start_validation
  - id: chair_kitchen
    start: kitchen_close_view
    query: chair
    target_class: chair
    expected: navigation_success
    instance_policy: nearest_same_class_gt
  - id: table_kitchen
    start: kitchen_close_view
    query: table
    target_class: table
    expected: navigation_success
    instance_policy: nearest_same_class_gt
  - id: floor_nonqueryable
    start: kitchen_view
    query: floor
    expected: no_target_or_goal
    query_status: nonqueryable
  - id: bed_absent_control
    world_file: aws_robomaker/small_house/worlds/small_house_no_bed.world
    start: kitchen_view
    query: bed
    expected: no_target_or_goal
    query_status: accepted
    world_absent_assets:
      - model://aws_robomaker_residential_Bed_01
  - id: car_outside_profile
    start: kitchen_view
    query: car
    expected: no_target_or_goal
    query_status: unresolved
  - id: table_unsupported_checkpoint
    start: kitchen_view
    query: table
    model_id: nvidia/segformer-b0-finetuned-cityscapes-1024-1024
    model_revision: 21b3847fae21ddee674abd31129307b6a1235bd9
    expected: no_target_or_goal
    query_status: unsupported

seed: 7
startup_timeout_wall_sec: 180.0
# Class-level smoke tolerance to model origins; not a surface/center accuracy claim.
target_origin_tolerance_xy_m: 1.5
warmup_sim_sec: 15.0
query_timeout_wall_sec: 120.0
negative_observation_wall_sec: 15.0
